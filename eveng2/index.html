<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>オセロ・アドバイザー for Even G2</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #0c1210; color: #e8f5e9; padding: 14px; }
  h1 { font-size: 17px; margin: 2px 0 4px; }
  .sub { font-size: 12px; color: #9db8a4; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button { background: #1d5c38; color: #fff; border: 0; border-radius: 10px; padding: 11px 14px; font-size: 14px; }
  button.secondary { background: #2b3a30; }
  button:disabled { opacity: .45; }
  #status { font-size: 13px; color: #b9d6c0; min-height: 18px; margin: 6px 0 10px; white-space: pre-wrap; }
  #stage { position: relative; display: none; margin-bottom: 10px; }
  #stage img { width: 100%; display: block; border-radius: 8px; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .handle { fill: #ffd54a; stroke: #333; stroke-width: 1.5; cursor: grab; }
  #boardGrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-width: 420px; margin: 8px 0; }
  .cell { aspect-ratio: 1; background: #14532d; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; }
  .cell.lowconf { outline: 2px solid #ff9800; outline-offset: -2px; }
  .disc { width: 78%; height: 78%; border-radius: 50%; }
  .disc.b { background: #111; border: 1px solid #666; }
  .disc.w { background: #f5f5f5; }
  .cell .rank { position: absolute; top: 1px; left: 3px; font-size: 10px; color: #ffd54a; font-weight: 700; }
  select { background: #2b3a30; color: #fff; border-radius: 8px; padding: 10px; font-size: 14px; border: 0; }
  #adviceBox { font-size: 14px; line-height: 1.55; white-space: pre-wrap; background: #12241a; border-radius: 10px; padding: 10px 12px; display: none; }
  .hint { font-size: 12px; color: #9db8a4; line-height: 1.6; }
</style>
  <script type="module" crossorigin src="./assets/index-CvcMFq9x.js"></script>
</head>
<body>
  <h1>オセロ・アドバイザー for Even G2</h1>
  <div class="sub">写真 → 認識 → 助言を G2 に表示します。グラス側: クリック=撮影 / スクロール=候補切替 / ダブルクリック=終了</div>

  <div class="row">
    <button id="camBtn">📷 撮影して認識</button>
    <button id="albBtn" class="secondary">🖼 アルバムから</button>
    <input id="fileInput" type="file" accept="image/*" style="display:none" />
  </div>

  <div id="status">準備中…</div>

  <div id="stage">
    <img id="photoImg" alt="" />
    <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
      <polygon id="poly" points="" fill="rgba(255,213,74,0.12)" stroke="#ffd54a" stroke-width="0.6" />
      <circle class="handle" data-i="0" r="3.2" />
      <circle class="handle" data-i="1" r="3.2" />
      <circle class="handle" data-i="2" r="3.2" />
      <circle class="handle" data-i="3" r="3.2" />
    </svg>
  </div>

  <div class="row" id="recogRow" style="display:none">
    <button id="recognizeBtn">盤面を読み取る</button>
    <select id="turnSel">
      <option value="1">● 黒の番</option>
      <option value="-1">○ 白の番</option>
    </select>
  </div>

  <div id="boardGrid"></div>
  <div class="row" id="sendRow" style="display:none">
    <button id="adviseBtn">アドバイスをグラスへ送る</button>
  </div>
  <div id="adviceBox"></div>

  <p class="hint">
    使い方: 撮影 → 黄色い丸を盤の四隅に合わせる →「盤面を読み取る」→ オレンジ枠のマスは自信が低いので、
    盤面をタップして直す（空→黒→白の順に切替）→ グラスへ送信。<br />
    ブラウザで開いた場合はグラス送信なしで動作確認だけできます。
  </p>

</body>
</html>
